<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeout</title>
</head>
<body>
        <button id="button">Click</button>
        <script>
            
            const button = document.getElementById("button");

            function ButtonClick() {
                alert("Hiiiiiiiiiiiiiiiiiiiiii")
            }

            function setTimeNow() {
                Timer = setTimeout(ButtonClick,1000)
            }

            button.addEventListener("click",setTimeNow);

            function name(params) {
                clearTimeout(Timer)
            }

            button.addEventListener("mouseover",function ClearTimeOut(params) {
                name();
            })

        </script>
</body>
</html>
