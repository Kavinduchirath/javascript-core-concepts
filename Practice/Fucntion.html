<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JavaScript Practice</title>
</head>
<style>
    .class{
        display: flex;
        background-color: black;
        color: aliceblue;
        padding: 1.3em;
        justify-content: space-between;
    }

    button{
        padding: 0.1em;
        width: 75px;
        border: none;
        border-radius: 99px;
    }

    button:hover{
        background-color: red;
        color: aliceblue;
    }

    p{
        border: 1px solid rgb(255, 248, 248);
    }
</style>
<body>

    <div class="class">
        <button id="negt">-</button>
        <p id="count"></p>
        <button id="plus">+</button>
    </div>

    <button id="reset">Reset</button>

    <script>

        let count = 0

        function incCount() {
            count = count + 1
            document.getElementById("count").innerHTML = count;
        }

        function negCount() {
            count = count - 1
            document.getElementById("count").innerHTML = count;
        }

        function resetCount() {
            count = 0
            document.getElementById("count").innerHTML = count;
        }

        document.getElementById("plus").onclick = incCount;
        document.getElementById("negt").onclick = negCount;
        document.getElementById("reset").onclick = resetCount;
        
    </script>
</body>
</html>
